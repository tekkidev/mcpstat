# mcpstat - Usage tracking and analytics for MCP servers.
# https://github.com/tekkidev/mcpstat
#
# Copyright (c) 2026 Vadim Bakhrenkov
# SPDX-License-Identifier: MIT

name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check distributions without publishing to PyPI
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Verify release versions
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python - <<'PY'
          import ast
          import os
          import re
          import tomllib
          from pathlib import Path

          package = tomllib.loads(Path('pyproject.toml').read_text())['tool']['poetry']
          version = package['version']
          if package['name'] != 'mcpstat' or not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Expected a stable mcpstat release')
          if os.environ['DRY_RUN'] != 'true':
              if os.environ['RELEASE_REPOSITORY'] != 'tekkidev/mcpstat':
                  raise SystemExit('Publishing is restricted to tekkidev/mcpstat; use a dry run here')
              if os.environ['RELEASE_REF_TYPE'] != 'tag':
                  raise SystemExit('Publishing requires selecting a release tag')
          if os.environ['RELEASE_REF_TYPE'] == 'tag':
              if os.environ['RELEASE_REF'] not in (version, 'v' + version):
                  raise SystemExit('Release tag does not match the package version')
          config = ast.parse(Path('mcpstat/__init__.py').read_text())
          app_version = next(ast.literal_eval(node.value) for node in config.body
                             if isinstance(node, ast.Assign)
                             and any(isinstance(t, ast.Name) and t.id == '__version__' for t in node.targets))
          if app_version != version:
              raise SystemExit('Application and package versions differ')
          import json
          manifest = json.loads(Path('server.json').read_text())
          if manifest['version'] != version or manifest['packages'][0]['version'] != version:
              raise SystemExit('Registry version differs from the package')
          heading = re.search(r'^## \[([^]]+)\] - \d{4}-\d{2}-\d{2}$',
                              Path('CHANGELOG.md').read_text(), re.MULTILINE)
          if not heading or heading.group(1) != version:
              raise SystemExit('The first changelog entry must match the release')
          PY
      - name: Verify source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" bandit pip-audit
          python build_package.py
          python -m pytest
          python -m ruff check mcpstat
          python -m mypy mcpstat
          python -m bandit -c pyproject.toml -r mcpstat
          python -m pip_audit
      - name: Build distributions and check metadata
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build --outdir "$RUNNER_TEMP/mcpstat-dist"
          python -m twine check --strict "$RUNNER_TEMP"/mcpstat-dist/*
      - name: Verify installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          wheels=("$RUNNER_TEMP"/mcpstat-dist/*.whl)
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install "${wheels[0]}[server]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" "$GITHUB_WORKSPACE/tests/verify_distribution.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: ${{ runner.temp }}/mcpstat-dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.repository == 'tekkidev/mcpstat' && !inputs.dry_run && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/mcpstat/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions with attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true
