[build-system]
requires = ["poetry-core>=2.5,<3"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "mcpstat"
version = "0.3.0"
description = "Python MCP server observability: usage statistics, outcomes, latency, and optional file logging"
authors = ["Vadim Bakhrenkov <hello@vadim.dev>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/tekkidev/mcpstat"
repository = "https://github.com/tekkidev/mcpstat"
keywords = [
    "mcp",
    "model-context-protocol",
    "statistics",
    "analytics",
    "usage-tracking",
    "logging",
    "ai",
    "llm",
    "agent",
    "mcp-server",
    "tool-tracking",
    "observability",
    "token-tracking",
    "latency-tracking",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
packages = [
    {include = "mcpstat"},
    {include = "README.md", to = "mcpstat/_docs"},
    {include = "llms.txt", to = "mcpstat/_docs"},
    {include = "llms-full.txt", to = "mcpstat/_docs"},
    {include = "docs/quickstart.md", to = "mcpstat/_docs"},
    {include = "docs/api.md", to = "mcpstat/_docs"},
    {include = "docs/configuration.md", to = "mcpstat/_docs"},
    {include = "docs/token-tracking.md", to = "mcpstat/_docs"},
    {include = "docs/latency-tracking.md", to = "mcpstat/_docs"},
]
include = [
    "build_package.py",
    "CHANGELOG.md",
    "CODE_OF_CONDUCT.md",
    "LICENSE",
    {path = "ThirdPartyNotices.md", format = ["sdist", "wheel"]},
    "README.md",
    "llms.txt",
    "llms-full.txt",
    "server.json",
    "docs/**/*.md",
    "examples/**/*.py",
    "tests/**/*",
    "mcpstat/py.typed",
]
exclude = [
    "mcpstat/_docs/**",
    "**/__pycache__",
    "**/*.pyc",
    "**/*.egg-info",
    "**/*.sqlite",
    "**/*.sqlite-wal",
    "**/*.sqlite-shm",
    "**/*.log",
]

[tool.poetry.scripts]
mcpstat = "mcpstat.server:main"

[tool.poetry.urls]
Documentation = "https://mcpstat.vadim.dev"
Changelog = "https://github.com/tekkidev/mcpstat/blob/main/CHANGELOG.md"
Issues = "https://github.com/tekkidev/mcpstat/issues"
Author = "https://vadim.dev"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
mcp = {version = ">=2.3.0,<3", optional = true}
jsonschema = {version = ">=4.26,<5", optional = true}
platformdirs = {version = ">=4.9,<5", optional = true}
# Optional dependencies for extras
pytest = {version = ">=8.3,<10", optional = true}
pytest-asyncio = {version = ">=1.0,<2", optional = true}
pytest-cov = {version = ">=6,<8", optional = true}
mypy = {version = ">=2.4,<3", optional = true}
ruff = {version = ">=0.17,<0.18", optional = true}

[tool.poetry.extras]
server = ["mcp", "jsonschema", "platformdirs"]
mcp = ["mcp", "jsonschema", "platformdirs"]
dev = ["mcp", "jsonschema", "platformdirs", "pytest", "pytest-asyncio", "pytest-cov", "mypy", "ruff"]
all = ["mcp", "jsonschema", "platformdirs", "pytest", "pytest-asyncio", "pytest-cov", "mypy", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --cov=mcpstat --cov-branch --cov-report=term-missing"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["mcpstat"]
branch = true
relative_files = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
show_missing = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true
exclude = ["examples/", "tests/"]

[[tool.mypy.overrides]]
module = "mcpstat.server"
warn_unused_ignores = false  # MCP SDK types vary across versions

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function-call-in-default-argument
    "UP017",  # datetime.UTC - requires Python 3.11+, we support 3.10
]

[tool.ruff.lint.isort]
known-first-party = ["mcpstat"]

[tool.bandit]
exclude_dirs = ["tests", "examples"]
skips = ["B101"]  # assert_used - acceptable in tests
